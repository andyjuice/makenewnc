# Home carousel — hand-of-cards on the landing page.
#
# How to update:
#   1. Add image files to public/images/carousel/  (jpg, png, webp, svg)
#   2. Add or edit an entry below. Order = deck order (first card shows first).
#
# Fields per card:
#   image — filename in public/images/carousel/  OR  site path starting with /
#   alt   — short description (required; screen readers + image search SEO)
#   link  — optional URL; when set, the front card shows an external-link button

